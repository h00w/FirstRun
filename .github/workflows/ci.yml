name: Repository foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check local documentation links
        run: python scripts/check_repository.py
      - name: Run checker regressions
        run: python -m unittest discover -s tests -v
      - name: Compile verification scripts
        run: python -m compileall -q scripts tests
